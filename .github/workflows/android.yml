name: Compilar Android para teste
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar SDK e ferramentas nativas
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Restaurar bancos da versão publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.27-preview1 --repo "$GITHUB_REPOSITORY" --pattern 'Piano-Universe-Bancos-Incluidos.zip' --dir "$RUNNER_TEMP/universe-assets"
          python scripts/restore_assets.py "$RUNNER_TEMP/universe-assets/Piano-Universe-Bancos-Incluidos.zip"
      - name: Compilar APK de desenvolvimento
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Piano-Universe-debug
          path: build/outputs/apk/debug/*.apk
