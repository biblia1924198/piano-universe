name: Verificar fontes
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_publication.py
      - run: node --check docs/site.js
      - run: node --check docs/piano.js
      - run: node tests/web/piano.cjs
      - run: node tests/web/site.cjs
